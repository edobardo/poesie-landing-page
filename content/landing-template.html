<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Poesie</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#f7f1e7">
  <link rel="icon" href="/assets/appicon.webp">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-copy="skip"></a>
  <header>
    <a class="brand" href="#"><img src="/assets/appicon.webp" alt="" width="42" height="42">Poesie<span></span></a>
    <nav><a href="#esperienza" data-copy="navWrite"></a><a href="#racconti" data-copy="navCreate"></a><a href="#domande" data-copy="navFaq"></a></nav>
    <a class="button small" data-store data-copy="download"></a>
  </header>
  <main id="main">
    <section class="hero wrap">
      <div class="hero-copy">
        <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span><span data-copy="eyebrow"></span></p>
        <h1 data-copy="hero" data-html></h1>
        <p class="intro" data-copy="intro"></p>
        <div class="hero-actions"><a class="button" data-store data-copy="download"></a><a class="text-link" href="#racconti" data-copy="discover"></a></div>
        <p class="fine" data-copy="freeNote"></p>
        <div class="hero-signature"><svg class="context-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m16 3 5 5-12 12-6 1 1-6Z"></path><path d="m14 5 5 5M3 21h18"></path></svg><p data-copy="signature"></p></div>
      </div>
      <figure class="hero-art"><a data-poster="share" data-title="heroAlt"></a><figcaption data-copy="imageNote"></figcaption></figure>
      <div class="hero-bottom"><span>POESIE — <span data-app-name></span></span><a href="#esperienza" data-copy="scroll"></a></div>
    </section>
    <section id="esperienza" class="writing wrap section">
      <figure class="poster writing-art"><a data-poster="write" data-title="writeAlt"></a></figure>
      <div class="story-copy"><p class="eyebrow">01 / <span data-copy="navWrite"></span></p><h2 data-copy="writeTitle"></h2><p class="body-copy" data-copy="writeBody"></p><ul class="quiet-list">
        <li><svg class="context-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span data-copy="writePoint1"></span></li>
        <li><svg class="context-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18h6M10 21h4M9 15a6 6 0 1 1 6 0v3H9Z"></path></svg><span data-copy="writePoint2"></span></li>
        <li><svg class="context-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11a9 9 0 1 1 2.6 7.4M3 4v7h7M12 7v5l3 2"></path></svg><span data-copy="writePoint3"></span></li>
      </ul><p class="caption-note" data-copy="templateNote"></p></div>
    </section>
    <section id="racconti" class="create-section section"><div class="wrap">
      <div class="section-heading"><div><p class="eyebrow">02 / <span data-copy="navCreate"></span></p><h2 data-copy="createTitle"></h2></div><p class="body-copy" data-copy="createBody"></p></div>
      <div class="create-grid">
        <article class="create-card"><div class="card-copy"><span class="card-index">I.</span><h3 data-copy="stylesTitle"></h3><p data-copy="stylesBody"></p><p class="caption-note" data-copy="stylesNote"></p></div><figure class="poster"><a data-poster="styles" data-title="stylesAlt"></a></figure></article>
        <article class="create-card"><div class="card-copy"><span class="card-index">II.</span><h3 data-copy="videoTitle"></h3><p data-copy="videoBody"></p><p class="caption-note" data-copy="videoNote"></p></div><figure class="poster"><a data-poster="video" data-title="videoAlt"></a></figure></article>
      </div>
    </div></section>
    <section class="book-section section"><div class="wrap book-grid">
      <div class="story-copy"><p class="eyebrow">03 / <span data-copy="bookLabel"></span></p><span class="badge">Premium</span><h2 data-copy="bookTitle"></h2><p class="body-copy" data-copy="bookBody"></p><p class="book-formats" data-copy="formats"></p><a class="text-link" href="#premium" data-copy="premiumLink"></a></div>
      <figure class="poster"><a data-poster="book" data-title="bookAlt"></a></figure>
    </div></section>
    <section class="space-section wrap section"><figure class="poster"><a data-poster="space" data-title="spaceAlt"></a></figure><div class="story-copy"><p class="eyebrow">04 / <span data-copy="spaceLabel"></span></p><h2 data-copy="spaceTitle"></h2><p class="body-copy" data-copy="spaceBody"></p><div class="storage-options"><span>Google Drive</span><span>OneDrive</span><span data-copy="local"></span></div><p class="caption-note" data-copy="securityNote"></p></div></section>
    <section id="premium" class="premium-section section"><div class="wrap">
      <div class="section-heading"><div><p class="eyebrow" data-copy="premiumEyebrow"></p><h2 data-copy="premiumTitle"></h2></div><p class="body-copy" data-copy="premiumBody"></p></div>
      <div class="plans"><article class="plan"><p class="plan-label" data-copy="freeLabel"></p><h3 data-copy="freeTitle"></h3><ul data-list="freeFeatures"></ul></article><article class="plan premium-plan"><p class="plan-label">Poesie Premium</p><h3 data-copy="paidTitle"></h3><ul data-list="paidFeatures"></ul><p class="caption-note" data-copy="priceNote"></p></article></div>
    </div></section>
    <section id="domande" class="faq wrap section"><div><p class="eyebrow" data-copy="faqLabel"></p><h2 data-copy="faqTitle"></h2></div><div class="questions" data-faq></div></section>
    <section class="closing wrap"><div class="closing-copy"><p class="eyebrow" data-copy="closingLabel"></p><h2 data-copy="closingTitle"></h2><a class="button" data-store data-copy="download"></a><p class="fine" data-copy="freeNote"></p></div><figure><img src="/assets/showcase/feature-1024.webp" width="1024" height="500" loading="lazy" decoding="async" data-alt="featureAlt"></figure></section>
  </main>
  <footer></footer>
  <dialog id="lightbox"><button class="close" type="button" autofocus>×</button><img alt="" width="960" height="1720"><p></p></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
